name: CI

# Nao chama a rede. Os testes usam substitutos das funcoes de HTTP e ficheiros
# GEDCOM e PDF gerados em memoria. Os testes que falam com servidores reais
# (tests/test_digitarq_live.py, tests/test_hemeroteca_bn_live.py) sao marcados
# `live` e correm a mao, cada um com a sua variavel (DIGITARQ_LIVE, HEMEROTECA_BN_LIVE).
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 e o minimo que o README promete; 3.12 e o que a maioria usa hoje.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_repo_hygiene le o log completo dos commits

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          # opcional para quem usa a skill; aqui entra para os testes do
          # hemeroteca_bn.py nao serem saltados (importorskip) no CI
          pip install -r scripts/requirements-hemeroteca.txt
          pip install -r scripts/requirements-dev.txt

      - name: Lint
        run: ruff check scripts tests

      - name: Testes
        run: pytest -q
