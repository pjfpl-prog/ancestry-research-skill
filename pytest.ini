[pytest]
# O marcador `live` fala com servidores reais (DigitArq, Hemeroteca da BN) e nao
# corre no CI. Cada ficheiro live tem a sua variavel de ambiente, para se poder
# correr um sem gastar pedidos no outro:
#   DIGITARQ_LIVE=1       pytest -q -m live tests/test_digitarq_live.py
#   HEMEROTECA_BN_LIVE=1  pytest -q -m live tests/test_hemeroteca_bn_live.py
markers =
    live: toca num servidor real (precisa de DIGITARQ_LIVE=1 ou HEMEROTECA_BN_LIVE=1)
addopts = -m "not live"
